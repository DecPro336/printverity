[pytest]
testpaths = tests
filterwarnings =
    # ezdxf's matrix code sets ndarray.shape, deprecated in NumPy 2.5; nothing to change on our side
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:ezdxf
    # the AssemblyAI SDK still calls pydantic's deprecated BaseModel.copy
    ignore:The `copy` method is deprecated:DeprecationWarning:assemblyai
